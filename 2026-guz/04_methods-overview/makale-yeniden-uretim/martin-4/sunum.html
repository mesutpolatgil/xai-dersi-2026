<style>
/* Layout: stage holds one 16:9 slide, thumbnail rail below, notes drawer under the stage. Colors follow the deck (navy, blue, green, orange). */
:root{
  --bg:#e9eef5; --panel:#ffffff; --ink:#12284a; --muted:#5a6a82; --hair:#cfd8e4;
  --blue:#2272b9; --green:#1e7a55; --orange:#ef8a2a; --navy:#112a47;
  --sans:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1626; --panel:#13233a; --ink:#e7eef8; --muted:#9db0c8; --hair:#26395a; --blue:#5aa2e6; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0b1626; --panel:#13233a; --ink:#e7eef8; --muted:#9db0c8; --hair:#26395a; --blue:#5aa2e6; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--panel)}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding-block:10px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel); border-bottom:1px solid var(--hair)}
.stripe{position:absolute; left:0; right:0; bottom:-1px; height:3px; background:linear-gradient(90deg,var(--blue) 0 62.5%,var(--green) 62.5% 85%,var(--orange) 85%)}
.top h1{font-size:15px; font-weight:600; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.btn{font:inherit; font-size:13.5px; color:var(--ink); background:transparent; border:1px solid var(--hair); border-radius:8px; padding:6px 12px;
  cursor:pointer; text-decoration:none; white-space:nowrap; display:inline-flex; align-items:center; gap:6px}
.btn:hover{border-color:var(--blue); color:var(--blue)}
.btn:focus-visible,.thumb:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:#fff}
main{max-width:1280px; margin:0 auto; padding-block:20px 40px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid; gap:16px}
.stage{position:relative; background:#000; border-radius:10px; overflow:hidden; box-shadow:0 10px 40px rgba(17,42,71,.18); aspect-ratio:16/9; max-width:100%;
  max-height:calc(100vh - 230px); margin:0 auto; width:min(100%, calc((100vh - 230px) * 16 / 9))}
.stage img{display:block; width:100%; height:100%; object-fit:contain; background:#fff}
.nav{position:absolute; top:0; bottom:0; width:22%; border:0; background:transparent; cursor:pointer; padding:0}
.nav.prev{left:0; cursor:w-resize} .nav.next{right:0; cursor:e-resize}
.nav:focus-visible{outline:3px solid var(--orange); outline-offset:-3px}
.ctrl{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap}
.count{font-variant-numeric:tabular-nums; color:var(--muted); min-width:72px; text-align:center}
.notes{background:var(--panel); border:1px solid var(--hair); border-radius:10px; padding:16px 20px; line-height:1.6; max-width:1000px; margin:0 auto; width:100%}
.notes h2{margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.notes p{margin:0 0 8px}
.rail{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 10px; scroll-snap-type:x proximity}
.thumb{flex:0 0 auto; width:150px; border:2px solid transparent; border-radius:6px; padding:0; background:var(--panel); cursor:pointer; scroll-snap-align:center; position:relative}
.thumb img{display:block; width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:4px}
.thumb span{position:absolute; left:4px; bottom:4px; font-size:11px; background:rgba(17,42,71,.85); color:#fff; padding:1px 6px; border-radius:4px; font-variant-numeric:tabular-nums}
.thumb[aria-current="true"]{border-color:var(--orange)}
.hint{text-align:center; color:var(--muted); font-size:12.5px; margin:0}
/* fullscreen: slide only */
.stage:fullscreen{border-radius:0; max-height:none; width:100%; height:100%; aspect-ratio:auto}
@media (max-width:640px){ .thumb{width:110px} .top h1{flex-basis:100%} .hint{display:none} }
@media (prefers-reduced-motion:no-preference){ .stage img{transition:opacity .15s} }

<script>
const SLIDES = [{"n": 1, "title": "Methods Overview · Data and Models", "alt": "By design Linear models Short trees Global methods PDP · ALE · PFI Local methods LIME SHAP Methods Overview Data and Models A critical review of explanation methods, feature dependence and model complexity Asasira Martin MSc Artificial Intelligence and Data Science Sivas Cumhuriyet University · November 2026 20259258040@cumhuriyet.edu.tr Supervisor: Dr. Mesut Polatgil", "notes": ["Bu sunumda Molnar'ın Interpretable Machine Learning kitabının 4. ve 5. bölümleri üzerine hazırladığım eleştirel derlemeyi sunuyorum. Derleme, açıklama yöntemlerini, veri özelliklerini ve model karmaşıklığını birlikte ele alıyor. Sağdaki daireler incelenen yöntem gruplarını gösteriyor: yerel yöntemler, genel yöntemler ve baştan yorumlanabilir modeller.", "English:", "In this presentation I present my critical review of Chapters 4 and 5 of Molnar's Interpretable Machine Learning. The review looks at explanation methods, data properties and model complexity together. The circles on the right show the method groups that were reviewed: local methods, global methods and models that are interpretable by design."]}, {"n": 2, "title": "Motivation: predictive accuracy does not show how a model behaves", "alt": "Motivation: predictive accuracy does not show how a model behaves Data Features go in ? Complex model Prediction Often very accurate Why this output? ? Is the explanation stable? ? Does it match the data? ? This review: a focused narrative review of Molnar (3rd ed.), Ch. 4 and 5, and the primary method papers. It separates published findings, its own critical interpretations and recommendations.", "notes": ["Derlemenin çıkış noktası şu: bir modelin doğru tahmin yapması, nasıl davrandığını göstermez. Akış şeması bunu gösteriyor; veri girer, karmaşık model çalışır ve tahmin çıkar, ama aradaki süreci göremeyiz. Alttaki üç soru derlemenin baktığı konular: Neden bu sonuç? Açıklama sağlam mı? Veriye uyuyor mu? Yöntem olarak odaklı bir anlatı derlemesi yapıldı. Derleme, yayımlanmış bulguları, kendi eleştirel yorumlarını ve önerilerini ayrı tutuyor.", "English:", "The starting point of the review is this: a model that predicts accurately does not show how it behaves. The flow diagram shows this; data goes in, a complex model runs and a prediction comes out, but we cannot see the process in between. The three questions below are what the review looks at: Why this output? Is the explanation stable? Does it match the data? The method is a focused narrative review. The review keeps published findings, its own critical interpretations and its recommendations separate."]}, {"n": 3, "title": "The review addresses three research questions", "alt": "The review addresses three research questions RQ1 Methods How do the main families of interpretation methods differ in goals, assumptions and limits? RQ2 Data and models How do feature dependence, nonlinear relationships and model complexity change what an explanation means? RQ3 Practice What should guide the choice and evaluation of an interpretation method?", "notes": ["Derleme üç araştırma sorusuna cevap arıyor. RQ1: Yorumlama yöntemlerinin ana grupları amaç, varsayım ve sınırlar açısından nasıl farklılaşıyor? RQ2: Özellik bağımlılığı, doğrusal olmayan ilişkiler ve model karmaşıklığı açıklamaların anlamını nasıl etkiliyor? RQ3: Yöntem seçerken ve değerlendirirken nelere dikkat edilmeli? RQ1 yöntem bölümlerinde, RQ2 veri ve model bölümlerinde, RQ3 ise öneri bölümünde cevaplanıyor.", "English:", "The review seeks answers to three research questions. RQ1: How do the main groups of interpretation methods differ in goals, assumptions and limits? RQ2: How do feature dependence, nonlinear relationships and model complexity affect what explanations mean? RQ3: What should guide the selection and evaluation of a method? RQ1 is answered in the methods sections, RQ2 in the data and model sections, and RQ3 in the recommendation section."]}, {"n": 4, "title": "Reviewed taxonomy: interpretability by design versus post-hoc interpretation", "alt": "Reviewed taxonomy: interpretability by design versus post-hoc interpretation Interpretability approaches By design Post-hoc Model-specific Model-agnostic Local Global Linear and logistic regression, short trees, decision rules, RuleFit Gini importance, odds ratios, saliency maps LIME, SHAP: explain one prediction PDP, ALE, PFI: describe average behavior", "notes": ["Derleme, Molnar'ın 4. bölümdeki sınıflandırmasını temel alıyor. İlk ayrım, baştan yorumlanabilir modeller ile sonradan (post-hoc) yorumlama arasında. Sonradan yöntemler modele özel veya modelden bağımsız olabilir; modelden bağımsız olanlar da yerel ve genel olarak ayrılır. Derlemenin bir notu var: Molnar'ın da belirttiği gibi, bu kategoriler idealleştirmedir ve pratikte sınırlar bulanıktır.", "English:", "The review builds on Molnar's classification in Chapter 4. The first split is between interpretability by design and post-hoc interpretation. Post-hoc methods can be model-specific or model-agnostic; model-agnostic ones are further split into local and global. The review adds one note: as Molnar also says, these categories are idealizations and the boundaries are blurred in practice."]}, {"n": 5, "title": "Finding 1: intrinsic interpretability is a matter of degree, not an algorithm label", "alt": "Finding 1: intrinsic interpretability is a matter of degree, not an algorithm label 16 leaves at depth 4 Easy to read 4,096 leaves at depth 12 Impossible to read Readable by design Linear models, short trees, decision rules Correlation hurts Correlated features make coefficients unstable A matter of degree Size and data decide readability, not the algorithm name A binary tree of depth d has at most 2^d leaves.", "notes": ["Birinci bulgu: içsel yorumlanabilirlik bir derece meselesidir, bir algoritmanın etiketi değildir. Soldaki derinliği 4 olan ağacın en fazla 16 yaprağı var ve okunabilir. Derinlik 12 olunca yaprak sayısı 4.096'ya çıkabilir ve model okunamaz hale gelir. Doğrusal modellerde de özellikler bağlıysa katsayılar kararsız olur. Derlemeye göre yorumlanabilirliği model türü, model boyutu ve özellik bağımlılığı birlikte belirler.", "English:", "Finding one: intrinsic interpretability is a matter of degree, not a label of an algorithm. The tree on the left has depth 4, at most 16 leaves, and can be read. At depth 12 the number of leaves can reach 4,096 and the model can no longer be read. In linear models too, coefficients become unstable when features are linked. According to the review, interpretability is decided by model class, model size and feature dependence together."]}, {"n": 6, "title": "Finding 2: post-hoc explanations raise a fidelity problem", "alt": "Finding 2: post-hoc explanations raise a fidelity problem S Sample the data I Intervene on a feature P Predict with the model A Aggregate the results Strength: flexibility Works on any model that gives predictions Model and explanation can be changed independently Risk: fidelity The explanation may not reflect the model LIME and SHAP are estimates on top of the model Rudin: for high stakes, prefer interpretable models", "notes": ["İkinci bulgu: sonradan yapılan açıklamalar bir sadakat sorunu doğurur. Üstteki SIPA şeridi bu yöntemlerin nasıl çalıştığını gösteriyor: örnek al, müdahale et, tahmin et ve birleştir. Avantajları esnekliktir; her modele uygulanabilirler. Ama açıklama modeli tam yansıtmayabilir. LIME ve SHAP de modelin üzerine eklenen tahminlerdir. Rudin'e göre yüksek riskli kararlarda, yeterli performans veriyorsa yorumlanabilir modeller tercih edilmelidir.", "English:", "Finding two: post-hoc explanations create a fidelity problem. The SIPA strip at the top shows how these methods work: sample, intervene, predict and aggregate. Their strength is flexibility; they can be applied to any model. But the explanation may not fully reflect the model. LIME and SHAP are also estimates added on top of the model. According to Rudin, for high-stakes decisions, interpretable models should be preferred when they perform well enough."]}, {"n": 7, "title": "Finding 3: the five reviewed methods answer different questions", "alt": "Finding 3: the five reviewed methods answer different questions Method Scope Question it answers Main caveat under dependence LIME Local Which features drive this one prediction, in a simple local surrogate? Perturbed samples may ignore how features co-vary SHAP Local, can be aggregated How is this prediction shared among the features? Marginal sampling evaluates implausible inputs PDP Global How does the average prediction change with a feature? Extrapolates when features are dependent ALE Global How do predictions change within the observed range? Results depend on interval choice PFI Global", "notes": ["Üçüncü bulgu: incelenen beş yöntem farklı sorulara cevap verir ve birbirinin yerine kullanılamaz. LIME ve SHAP tek bir tahmini açıklar. PDP ve ALE özelliklerin etkisini gösterir; PFI ise modelin bir özelliğe ne kadar dayandığını ölçer. Bağımlılık varsa PDP ile ALE farklı sonuç verebilir; derlemeye göre bu fark da bilgi taşır. PFI ise gerçek dünyadaki önemi değil, belirli bir müdahale altındaki bağımlılığı ölçer.", "English:", "Finding three: the five reviewed methods answer different questions and cannot replace each other. LIME and SHAP explain a single prediction. PDP and ALE show feature effects; PFI measures how much the model relies on a feature. When there is dependence, PDP and ALE can give different results; according to the review, this difference is itself informative. PFI measures reliance under a specific intervention, not real-world importance."]}, {"n": 8, "title": "Case examples reviewed from Molnar (values reported, not reproduced)", "alt": "Case examples reviewed from Molnar (values reported, not reproduced) Bike rentals Regression · Washington, D.C. · 728 days Predict: Daily number of bikes rented From: Season, holiday, working day, weather, temperature, humidity, wind, rentals two days earlier Palmer penguins Classification · Antarctica · 333 penguins Predict: Sex of the penguin (female or male) From: Species, body mass, bill length, bill depth, flipper length Both use one two-thirds / one-third holdout split. All model results are as reported by Molnar.", "notes": ["Derleme, Molnar'ın 5. bölümdeki iki örneğini vaka olarak inceliyor. Bisiklet verisi bir regresyon örneği: Washington'da 728 günlük kiralama sayısı. Penguen verisi bir sınıflandırma örneği: 333 penguenin cinsiyeti tahmin ediliyor. Önemli bir not: model sonuçları Molnar'dan alınmıştır, bu derlemede yeniden üretilmemiştir.", "English:", "The review examines Molnar's two examples from Chapter 5 as case studies. The bike data is a regression example: 728 days of rental counts in Washington. The penguin data is a classification example: the sex of 333 penguins is predicted. An important note: the model results are taken from Molnar and were not reproduced in this review."]}, {"n": 9, "title": "Finding 4: the reported model results support only limited conclusions", "alt": "Finding 4: the reported model results support only limited conclusions Penguin sex classification, test-set accuracy Source: Molnar, Interpretable Machine Learning, 3rd ed., Tables 5.1 and 5.3 (one holdout split; not reproduced). One split, no uncertainty Small gaps such as 852 vs 883 RMSE may not hold across resamples Configurations, not complexity Logistic models encode species by stratification; trees must learn it 1 point ≈ 1 penguin About 111 test birds, so a 1-point accuracy gap is fragile", "notes": ["Dördüncü bulgu: Molnar'ın bildirdiği model sonuçları ancak sınırlı sonuçları destekler. Grafikte türe göre lojistik regresyon %93, random forest %92 ve karar ağacı %86 doğruluk gösteriyor. Derleme üç sınırlamaya dikkat çekiyor. Birincisi, sonuçlar tek bir bölmeden geliyor ve belirsizlik bildirilmemiş; örneğin 852 ile 883 RMSE farkı kararlı olmayabilir. İkincisi, bu karşılaştırma karmaşıklığın değil, farklı model kurulumlarının karşılaştırması. Üçüncüsü, test setinde yaklaşık 111 penguen var; yani 1 puan yaklaşık 1 penguen demek.", "English:", "Finding four: the model results reported by Molnar support only limited conclusions. In the chart, logistic regression by species reaches 93% accuracy, the random forest 92% and the decision tree 86%. The review points to three limitations. First, the results come from a single split and no uncertainty is reported; for example, the gap between 852 and 883 RMSE may not be stable. Second, this is a comparison of model configurations, not of complexity. Third, the test set has about 111 penguins, so 1 point is about 1 penguin."]}, {"n": 10, "title": "Finding 5: feature dependence must be examined before explanations are read", "alt": "Finding 5: feature dependence must be examined before explanations are read r = 0.87 correlation between flipper length and body mass in the 333 penguins Bike data: temperature and rentals two days earlier, r = 0.60 1 Permutation importance shuffles flipper length independently of body mass. 2 A heavy penguin gets a short flipper: a bird that does not exist. 3 The model is scored on these off-data inputs, so the result reflects extrapolation as much as real reliance. Check dependence first; prefer ALE or grouped methods. Sources: Molnar (3rd ed., Tables 5.2, 5.4); Hooker, Mentch and Zhou (2021", "notes": ["Beşinci bulgu: açıklamalar okunmadan önce özellik bağımlılığı incelenmelidir. Penguen verisinde yüzgeç uzunluğu ile vücut ağırlığı arasındaki korelasyon 0,87. Bisiklet verisinde de sıcaklık ile iki gün önceki kiralama arasında 0,60 korelasyon var. Permütasyon yöntemi bu bağı bozar ve gerçekte olmayan veri noktaları üretir; model bu noktalarda test edilir. Derlemenin önerisi: bağımlılık varsa ALE, koşullu veya grup bazlı yöntemler daha uygundur.", "English:", "Finding five: feature dependence should be examined before explanations are read. In the penguin data, the correlation between flipper length and body mass is 0.87. In the bike data, temperature and rentals two days earlier also have a correlation of 0.60. Permutation breaks this link and creates data points that do not exist in reality; the model is tested on these points. The review's suggestion: when there is dependence, ALE, conditional or grouped methods are more suitable."]}, {"n": 11, "title": "Finding 6: a global summary can describe a trend that holds for no species", "alt": "Finding 6: a global summary can describe a trend that holds for no species Correlation between bill depth and body mass Adelie +0.58 n = 146 Chinstrap +0.60 n = 68 Gentoo +0.72 n = 119 All species pooled −0.47 n = 333 Why the trend reverses Gentoo penguins are heavier but have shallower bills (~15.0 mm vs ~18.3 mm), so pooling places one heavy cluster beside two lighter ones. Discrepancy flagged by this review Molnar links the reversal to Gentoo having \"deeper bills\"; the public data show shallower ones. The paradox holds; its explanation is corrected. Pooled r as reported in Molnar (3rd ed., ", "notes": ["Altıncı bulgu: genel bir özet, hiçbir türde geçerli olmayan bir eğilimi gösterebilir. Her türün içinde gaga derinliği ile ağırlık pozitif ilişkili: 0,58, 0,60 ve 0,72. Ama bütün penguenler birleştirilince ilişki -0,47 oluyor; bu Simpson paradoksu. Nedeni, Gentoo penguenlerinin daha ağır ama gagalarının daha sığ olması. Derleme ayrıca bir tutarsızlık tespit etti: Molnar, Gentoo'ların gagasının daha derin olduğunu yazıyor, ama veriler daha sığ olduğunu gösteriyor. Paradoks geçerli, sadece açıklaması düzeltildi.", "English:", "Finding six: a global summary can show a trend that is true for no species. Within each species, bill depth and body mass are positively related: 0.58, 0.60 and 0.72. But when all penguins are pooled, the relationship becomes -0.47; this is Simpson's paradox. The reason is that Gentoo penguins are heavier but have shallower bills. The review also found a discrepancy: Molnar writes that Gentoo bills are deeper, but the data show they are shallower. The paradox holds; only its explanation is corrected."]}, {"n": 12, "title": "Discussion: explanation reliability depends on method, data and model together", "alt": "Discussion: explanation reliability depends on method, data and model together Methods answer different questions LIME and SHAP explain one prediction, PDP and ALE describe effects, PFI measures reliance. Their outputs are not interchangeable. Feature dependence must be checked Correlated features are routine in real data and distort importance rankings and attributions. Explanation quality is not accuracy An accurate model can give unstable explanations. First ask whether a simple model performs as well. Interpretability is not causality Temperature predicts bike rentals; an importance score ", "notes": ["Tartışma bölümünde derleme, açıklamanın güvenilirliğinin yöntem, veri ve modelin birlikte etkisine bağlı olduğunu savunuyor. Dört sonuç çıkıyor. Yöntemler farklı sorulara cevap verir. Özellik bağımlılığı sıradan bir durumdur ve mutlaka dikkate alınmalıdır. Doğruluk ile açıklama kalitesi aynı şey değildir. Yorumlanabilirlik nedenselliği kanıtlamaz. Ayrıca Rashomon etkisi var: benzer doğrulukta birçok model farklı açıklamalar verebilir, bu yüzden açıklamalar alternatif modellerde de kontrol edilmelidir.", "English:", "In the discussion, the review argues that the reliability of an explanation depends on the method, the data and the model together. Four conclusions follow. Methods answer different questions. Feature dependence is a routine condition and must be taken into account. Accuracy and explanation quality are not the same thing. Interpretability does not prove causality. There is also the Rashomon effect: many models with similar accuracy can give different explanations, so explanations should also be checked on alternative models."]}, {"n": 13, "title": "Recommendation: a data-aware process for selecting interpretation methods", "alt": "Recommendation: a data-aware process for selecting interpretation methods Orange: the steps most often skipped in practice. Steps 1–7 are this review's synthesis, not yet validated experimentally. 1 Define the objective One prediction, overall behavior, a ranking or debugging? 2 Examine the data Correlations, nonlinear dependence and meaningful subgroups 3 Evaluate candidate models Held-out data, with uncertainty across resamples 4 Consider a simple model If it performs well enough, no post-hoc method may be needed 5 Select post-hoc methods Match scope to the goal; prefer ALE or grouping under", "notes": ["Derlemenin önerisi, veriyi merkeze alan yedi adımlı bir yöntem seçme süreci. Önce amaç tanımlanır, sonra veri incelenir ve aday modeller karşılaştırılır. Turuncu gösterilen bu ilk üç adım, derlemenin değerlendirmesine göre pratikte en sık atlanan adımlardır. Ardından basit bir modelin yeterli olup olmadığına bakılır, uygun yöntem seçilir, açıklamanın güvenilirliği kontrol edilir ve sınırlar açıkça raporlanır. Bu süreç literatüre dayalı bir sentezdir, henüz deneysel olarak doğrulanmamıştır.", "English:", "The review's recommendation is a seven-step, data-aware process for choosing a method. First the goal is defined, then the data is examined and candidate models are compared. In the review's assessment, these first three steps, shown in orange, are the ones most often skipped in practice. Next, we check whether a simple model is enough, choose a suitable method, check the reliability of the explanation and report the limits clearly. This process is a synthesis of the literature and has not yet been validated experimentally."]}, {"n": 14, "title": "Implications for real-world systems (illustrative, not findings)", "alt": "Implications for real-world systems (illustrative, not findings) Healthcare Correlated clinical measurements make feature attributions hard to read. Credit scoring Income and employment overlap, so any single importance score is fragile. Public services Pooled explanations can hide differences between populations, as with the penguins. Build interpretation into model validation; each audience needs its own explanation. Illustrative extensions of the reviewed principles, not findings of the review.", "notes": ["Bu slayttaki çıkarımlar bulgu değil, incelenen ilkelerin örnek olarak genişletilmesidir. Sağlıkta klinik ölçümler birbirine bağlı olabilir ve özellik atfını zorlaştırabilir. Kredi puanlamada gelir ve iş durumu benzer bilgi taşır, bu yüzden tek bir önem skoru kırılgandır. Kamu hizmetlerinde birleştirilmiş açıklamalar gruplar arasındaki farkları gizleyebilir; bu, penguen örneğine benzer. Derlemeye göre yorumlama, model kurulduktan sonra değil, model doğrulama sürecinin bir parçası olmalıdır.", "English:", "The implications on this slide are not findings; they are illustrative extensions of the reviewed principles. In healthcare, clinical measurements can be linked and can make feature attribution harder. In credit scoring, income and employment carry similar information, so a single importance score is fragile. In public services, pooled explanations can hide differences between groups; this is similar to the penguin example. According to the review, interpretation should be part of model validation, not something added after the model is built."]}, {"n": 15, "title": "Conclusions, limitations and future work", "alt": "Conclusions, limitations and future work RQ1 Methods answer different questions Each method must be chosen for an explicit objective. RQ2 Data shapes explanations Dependence, nonlinearity, subgroups and complexity change how explanations are produced and read. RQ3 Accuracy, interpretability and causality differ Examine data and candidate models before selecting a method. Limitations Two chapters of one book; not systematic No models trained or results reproduced Selection process not yet validated Future work Simulate varying feature correlation Compare PDP, ALE and conditional methods Test su", "notes": ["Sonuç olarak derleme üç araştırma sorusuna şu cevapları veriyor. RQ1: Yorumlama yöntemleri farklı sorulara cevap verir ve açık bir amaca göre seçilmelidir. RQ2: Özellik bağımlılığı, doğrusal olmayan ilişkiler, alt gruplar ve model karmaşıklığı, açıklamaların nasıl üretildiğini ve okunduğunu belirler. RQ3: Doğruluk, yorumlanabilirlik ve nedensellik farklı şeylerdir; bu yüzden yöntem seçmeden önce veri ve modeller incelenmelidir. Sınırlılıklar: derleme bir kitabın iki bölümüne dayanıyor, sonuçlar yeniden üretilmedi ve önerilen süreç henüz doğrulanmadı. Gelecekte simülasyonlarla korelasyonun etkisi, PDP, ALE ve koşullu yöntemlerin karşılaştırılması ve vekil model sadakati incelenebilir.", "English:", "In conclusion, the review gives these answers to the three research questions. RQ1: Interpretation methods answer different questions and should be chosen for an explicit goal. RQ2: Feature dependence, nonlinear relationships, subgroups and model complexity determine how explanations are produced and read. RQ3: Accuracy, interpretability and causality are different things, so data and models should be examined before choosing a method. Limitations: the review is based on two chapters of one book, the results were not reproduced and the proposed process has not yet been validated. Future work could use simulations to study the effect of correlation, compare PDP, ALE and conditional methods, and test surrogate fidelity."]}, {"n": 16, "title": "References", "alt": "References [1]\tC. Molnar, Interpretable Machine Learning, 3rd ed., 2025. [2]\tF. Doshi-Velez and B. Kim, “Towards a rigorous science of interpretable machine learning,” arXiv:1702.08608, 2017. [3]\tC. A. Scholbeck et al., “Sampling, intervention, prediction, aggregation,” ECML PKDD Workshops, 2020. [4]\tM. T. Ribeiro, S. Singh and C. Guestrin, “Why should I trust you?,” KDD, 2016. [5]\tS. M. Lundberg and S.-I. Lee, “A unified approach to interpreting model predictions,” NIPS, 2017. [6]\tJ. H. Friedman, “Greedy function approximation: A gradient boosting machine,” Ann. Statist., 2001. [7]\tD. W. Aple", "notes": ["Kaynakçada derlemede kullanılan 19 kaynak yer alıyor. Ana kaynak, Molnar'ın kitabının üçüncü baskısı. Diğerleri LIME, SHAP, PDP, ALE ve PFI yöntemlerinin orijinal makaleleri, bağımlılık ve ekstrapolasyon üzerine eleştirel çalışmalar ve veri setlerinin kaynakları. Teşekkür ederim, sorularınızı alabilirim.", "English:", "The reference list contains the 19 sources used in the review. The main source is the third edition of Molnar's book. The others are the original papers for LIME, SHAP, PDP, ALE and PFI, critical work on dependence and extrapolation, and the sources of the datasets. Thank you, I am happy to take your questions."]}];
const pad = n => String(n).padStart(2,'0');
const img = document.getElementById('slide'), rail = document.getElementById('rail');
const notes = document.getElementById('notes'), notesBody = document.getElementById('notesBody');
let cur = 0;
SLIDES.forEach((s,i) => {
  const b = document.createElement('button'); b.className='thumb'; b.type='button';
  b.setAttribute('aria-label', 'Slide ' + s.n + ': ' + s.title);
  b.innerHTML = '<img loading="lazy" alt="" src="slides/slide-' + pad(s.n) + '.jpg"><span>' + s.n + '</span>';
  b.onclick = () => go(i); rail.appendChild(b);
});
// preload all slides for instant switching
SLIDES.forEach(s => { const p = new Image(); p.src = 'slides/slide-' + pad(s.n) + '.jpg'; });
function go(i, push = true){
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  img.src = 'slides/slide-' + pad(s.n) + '.jpg';
  img.alt = 'Slide ' + s.n + ': ' + s.alt;
  document.getElementById('count').textContent = s.n + ' / ' + SLIDES.length;
  notesBody.innerHTML = '';
  s.notes.forEach(t => { const p = document.createElement('p'); p.textContent = t; notesBody.appendChild(p); });
  [...rail.children].forEach((t,k) => t.setAttribute('aria-current', k === cur));
  rail.children[cur].scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  if (push && location.hash !== '#slide-' + s.n) history.replaceState(null, '', '#slide-' + s.n);
}
function fromHash(){ const m = location.hash.match(/^#slide-(\d+)$/); go(m ? +m[1] - 1 : 0, false); }
document.getElementById('prev').onclick = document.getElementById('prevZone').onclick = () => go(cur - 1);
document.getElementById('next').onclick = document.getElementById('nextZone').onclick = () => go(cur + 1);
const notesBtn = document.getElementById('notesBtn');
function toggleNotes(){ notes.hidden = !notes.hidden; notesBtn.setAttribute('aria-pressed', !notes.hidden);
  try { localStorage.setItem('sunum-notes', notes.hidden ? '0' : '1'); } catch(e){} }
notesBtn.onclick = toggleNotes;
try { if (localStorage.getItem('sunum-notes') === '1') toggleNotes(); } catch(e){}
const stage = document.getElementById('stage');
function fs(){ try { if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen().catch(()=>{}); } catch(e){} }
document.getElementById('fsBtn').onclick = fs;
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0); else if (e.key === 'End') go(SLIDES.length - 1);
  else if (e.key === 'f' || e.key === 'F') fs(); else if (e.key === 'n' || e.key === 'N') toggleNotes();
});
let x0 = null;
stage.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1)); x0 = null; });
addEventListener('hashchange', fromHash);
fromHash();
</script>
</body>
</html>
